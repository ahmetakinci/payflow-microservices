server:
  port: 8080

spring:
  application:
    name: api-gateway

  cloud:
    gateway:
      routes:
        - id: user-service
          uri: http://${USER_SERVICE_HOST:localhost}:8081
          predicates:
            - Path=/api/users/**

        - id: account-service
          uri: http://${ACCOUNT_SERVICE_HOST:localhost}:8082
          predicates:
            - Path=/api/accounts/**

        - id: payment-service
          uri: http://${PAYMENT_SERVICE_HOST:localhost}:8083
          predicates:
            - Path=/api/payments/**
