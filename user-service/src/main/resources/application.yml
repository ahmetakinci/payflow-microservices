server:
  port: 8081

spring:
  application:
    name: user-service

  security:
    user:
     name: ${SECURITY_USER:admin}
     password: ${SECURITY_PASSWORD:admin}

  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:5432/payflow_user
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
    database-platform: org.hibernate.dialect.PostgreSQLDialect

jwt:
  secret: ${JWT_SECRET:change-me-in-production-this-must-be-at-least-32-bytes-long-for-hs256}
  expiration-ms: ${JWT_EXPIRATION_MS:3600000}